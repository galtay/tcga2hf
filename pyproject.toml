[project]
name = "tcga2hf"
version = "0.1.0"
description = "Download public TCGA data from the NCI GDC and publish it to the Hugging Face Hub."
readme = "README.md"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.13.0",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "typer>=0.25.1",
]

[project.scripts]
tcga2hf = "tcga2hf.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that hit the live GDC / cBioPortal APIs (deselect with '-m \"not network\"')",
    "integration: tests that read locally built parquets under $HOME/data/tcga2hf/processed (deselect with '-m \"not integration\"')",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
