[project]
name = "tcga2hf-pipeline"
version = "0.1.0"
description = "Build pipeline that downloads public TCGA data from the NCI GDC and publishes it as the tcga2hf HuggingFace datasets."
readme = "README.md"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "tcga2hf",
    "httpx>=0.28.1",
    "huggingface-hub>=1.13.0",
    "openpyxl>=3.1",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "typer>=0.25.1",
]

[project.scripts]
tcga2hf-pipeline = "tcga2hf_pipeline.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
