[project]
name = "tcga2hf"
version = "0.1.0"
description = "Typed pydantic models + pyarrow schemas for the gabrielaltay/tcga-{patients,tabular}-open HuggingFace datasets."
readme = "README.md"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
